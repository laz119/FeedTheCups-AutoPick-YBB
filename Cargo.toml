[package]
name = "ybb"
version = "1.0.0"
edition = "2021"
description = "YBB —— 杯杯倒满 地铁模式自动选卡"
autobins = false

# 命令行版（探针、调试、以及 .bat 调用）
[[bin]]
name = "ybb-cli"
path = "src/main.rs"

# 图形界面版（双击即用）
[[bin]]
name = "YBB"
path = "src/gui.rs"

[dependencies]
unicode-normalization = "0.1"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
